name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      build_release:
        description: "Build Windows and Linux release binaries"
        required: false
        default: false
        type: boolean

jobs:
  test:
    name: Rust tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain with cache
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: true

      - name: Run tests
        run: cargo test --locked

  release:
    name: Release on ${{ matrix.os }}
    if: github.event_name == 'workflow_dispatch' && inputs.build_release
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: topo_reconstruct-windows.exe
            binary_path: target/release/topo_reconstruct_rs.exe
          - os: ubuntu-latest
            artifact_name: topo_reconstruct-linux
            binary_path: target/release/topo_reconstruct_rs

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain with cache
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: true

      - name: Build release binary
        run: cargo build --release --locked

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.binary_path }}
          retention-days: 7
