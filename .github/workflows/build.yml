name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      build_release:
        description: "Build Windows and Linux release binaries"
        required: false
        default: false
        type: boolean
      build_app:
        description: "Build the portable Windows editor (Tauri, one exe)"
        required: false
        default: false
        type: boolean

jobs:
  test:
    name: Rust tests
    if: github.event_name != 'workflow_dispatch' || !inputs.build_app || inputs.build_release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain with cache
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: true

      - name: Run tests
        run: cargo test --locked

  release:
    name: Release on ${{ matrix.os }}
    if: github.event_name == 'workflow_dispatch' && inputs.build_release
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: topo_reconstruct-windows.exe
            binary_path: target/release/topo_reconstruct_rs.exe
          - os: ubuntu-latest
            artifact_name: topo_reconstruct-linux
            binary_path: target/release/topo_reconstruct_rs

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain with cache
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: true

      - name: Build release binary
        run: cargo build --release --locked

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.binary_path }}
          retention-days: 7

  # One Windows job, manual only: the desktop editor (Tauri + three.js UI).
  # The geometry core is tested on Linux by the `test` job and locally.
  app:
    name: Windows portable editor
    if: github.event_name == 'workflow_dispatch' && inputs.build_app
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain with cache
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: true
          cache-workspaces: app/src-tauri

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/ui/package-lock.json

      - name: Build UI
        working-directory: app/ui
        run: |
          npm ci
          npm run build

      # Gmsh meshes the model for the MIDAS export: its DLL goes inside the
      # executable (extracted to the temporary folder on first use).
      - name: Fetch the Gmsh library
        shell: pwsh
        run: |
          Invoke-WebRequest https://gmsh.info/bin/Windows/gmsh-4.15.2-Windows64-sdk.zip -OutFile gmsh-sdk.zip
          Expand-Archive gmsh-sdk.zip -DestinationPath gmsh-sdk
          $dll = Get-ChildItem gmsh-sdk -Recurse -Filter "gmsh-4*.dll" | Select-Object -First 1
          "GMSH_DLL_PATH=$($dll.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build portable executable
        working-directory: app/src-tauri
        run: npx --prefix ../ui tauri build

      - name: Upload portable executable
        uses: actions/upload-artifact@v4
        with:
          name: topo-editor-portable
          path: app/src-tauri/target/release/topo-editor.exe
          retention-days: 7
