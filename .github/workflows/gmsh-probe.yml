name: Gmsh backend probe

on:
  workflow_dispatch:

jobs:
  gmsh-probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download Gmsh wheel
        run: python -m pip download --no-deps gmsh==4.15.2 -d gmsh-wheel

      - name: Install Gmsh runtime dependency
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends libglu1-mesa

      - name: Install Gmsh
        run: python -m pip install --no-deps gmsh-wheel/*.whl

      - name: Install geometry audit dependencies
        run: python -m pip install -r scripts/requirements-audit.txt

      - name: Run OCC fragmentation self-test
        run: python scripts/gmsh_occ_trial.py --self-test --mesh-size 0.5

      - name: Upload Gmsh runtime for local private-model trial
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gmsh-linux-runtime
          path: |
            gmsh-wheel/*.whl
            scripts/gmsh_occ_trial.py
            scripts/check_gmsh_surface_junctions.py
            scripts/check_v2_global_geometry.py
            scripts/requirements-audit.txt
          retention-days: 1
